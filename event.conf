# Public, non-secret event settings - the one file to edit each year.
# build.sh reads this; an environment variable with the same name overrides it
# (npm run dev uses that to swap in Turnstile's test key).
# Secrets (password, address) do NOT go here: this repo is public.

# Start time, written in Pacific time with its UTC offset (-08:00 in November)
EVENT_DATE=2026-11-21T16:00:00-08:00

# When the party wraps up, and when the movie starts (same format)
EVENT_END=2026-11-21T21:00:00-08:00
MOVIE_START=2026-11-21T18:00:00-08:00

# Last year's date, shown on the thank-you page / ?view=full
HISTORIC_DATE=2025-11-15T18:00:00-08:00

# true after the event: redirects the home page to thank-you.html
SHOW_THANK_YOU_PAGE=false

# Cloudflare Turnstile site key (public by design; the secret key is a Pages secret)
TURNSTILE_SITE_KEY=0x4AAAAAAFLoxqTFrjmeu-Fh
