<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Block AI scrapers -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot-news" content="noindex, nofollow">

    <title>Scott Pilgrim & Sandwich Day 2026</title>

    <!-- Link previews land here (the rest of the site is password protected), so keep these in sync with index.html -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.scottpilgrimday.com/">
    <meta property="og:title" content="Scott Pilgrim & Sandwich Day 2026">
    <meta property="og:description" content="Join us November 21st, 2026 @ 4:00 PM for a Scott Pilgrim vs. The World screening and a build-your-own sandwich bar!">
    <meta property="og:image" content="https://www.scottpilgrimday.com/assets/images/cover.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.scottpilgrimday.com/">
    <meta name="twitter:title" content="Scott Pilgrim & Sandwich Day 2026">
    <meta name="twitter:description" content="Join us November 21st, 2026 @ 4:00 PM for a Scott Pilgrim vs. The World screening and a build-your-own sandwich bar!">
    <meta name="twitter:image" content="https://www.scottpilgrimday.com/assets/images/cover.png">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=turnstileReady&render=explicit" async defer></script>
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1 class="title">Scott Pilgrim<br><span class="subtitle">& Sandwich Day</span></h1>
        </header>

        <section class="login-card">
            <h2>Got an invite? Come on in.</h2>
            <p class="login-blurb">This party is invite-only. Enter the password from your invite to see the details.</p>
            <form class="login-form" method="POST" action="/api/login">
                <input type="hidden" name="next" id="login-next" value="/">
                <label class="login-label" for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus>
                <div id="turnstile-container" class="turnstile-container"></div>
                <button type="submit" class="btn-primary login-submit">Let me in</button>
                <p class="login-status" id="login-status" aria-live="polite"></p>
            </form>
        </section>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            document.getElementById('login-next').value = params.get('next') || '/';

            var messages = {
                password: "That password isn't right. Check your invite.",
                verify: 'Verification failed. Please try again.',
                config: 'The site is misconfigured. Let the host know!',
                invalid: 'Something went wrong. Please try again.'
            };
            var error = params.get('error');
            if (error) document.getElementById('login-status').textContent = messages[error] || messages.invalid;

            var config = window.EVENT_CONFIG || {};
            window.turnstileReady = function () {
                if (!config.turnstileSiteKey) {
                    document.getElementById('login-status').textContent = messages.config;
                    return;
                }
                window.turnstile.render('#turnstile-container', { sitekey: config.turnstileSiteKey, theme: 'auto' });
            };
        })();
    </script>
</body>
</html>
